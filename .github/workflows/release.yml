name: LYRR Release & Deployment

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-release-apk:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Release APK
        run: |
          cd frontend
          flutter build apk --release --dart-define=API_BASE_URL=http://100.27.229.125:8080/api/v1
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../dist/lyrr-server.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lyrr-server.apk
          generate_release_notes: true
          draft: false
          prerelease: false
