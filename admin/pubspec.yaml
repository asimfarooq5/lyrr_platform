name: lyrr_admin
description: LYRR Admin Portal - Web-based administration interface

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # HTTP Client
  http: ^1.1.0
  dio: ^5.4.0

  # State Management
  flutter_bloc: ^8.1.3
  provider: ^6.1.1

  # Routing
  go_router: ^12.1.1

  # UI Components
  fl_chart: ^0.66.0
  data_table_2: ^2.5.9
  file_picker: ^6.1.1

  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.2

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
