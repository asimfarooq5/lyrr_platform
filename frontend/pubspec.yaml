name: lyrr
version: 1.0.0+1
publish_to: none
description: LYRR - Enterprise audiobook synchronization platform

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking
  dio: ^5.4.0
  http: ^1.1.0
  connectivity_plus: ^5.0.2

  # Audio
  just_audio: ^0.9.36
  audio_session: ^0.1.18

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.1

  # Database
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  path: ^1.8.3

  # Encryption & Security
  encrypt: ^5.0.1
  crypto: ^3.0.3
  uuid: ^4.2.1

  # UI Components
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9

  # Utilities
  intl: ^0.18.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  logger: ^2.0.2+1
  equatable: ^2.0.5

  # Social Auth
  google_sign_in: ^6.1.6
  sign_in_with_apple: ^5.0.0

  # Notifications
  flutter_local_notifications: ^16.3.0

  # Analytics
  firebase_core: ^2.24.2
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.8

  # AI/ML
  google_mlkit_language_id: ^0.9.0
  google_mlkit_translation: ^0.9.0

  # Dictionary
  dictionaryx: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  drift_dev: ^2.14.0
  riverpod_generator: ^2.3.9
  freezed: ^2.4.5
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/audio/
    - assets/l10n/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Italic.ttf
          style: italic
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
    - family: OpenDyslexic
      fonts:
        - asset: assets/fonts/OpenDyslexic-Regular.otf
        - asset: assets/fonts/OpenDyslexic-Bold.otf
          weight: 700

flutter_intl:
  enabled: true
  class_name: L10n
  main_locale: en
  arb_dir: lib/l10n
  output_dir: lib/generated
