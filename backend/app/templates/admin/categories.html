{% extends "admin/base.html" %}
{% block content %}
<div class="header">
    <h2>Categories</h2>
    <button class="btn btn-primary" onclick="showModal('addCatModal')">+ Add Category</button>
</div>
<div class="card">
    <table>
        <thead><tr><th>Name</th><th>Slug</th><th>Actions</th></tr></thead>
        <tbody>
            {% for cat in categories %}
            <tr>
                <td>{{ cat.name }}</td>
                <td style="font-family:monospace;">{{ cat.slug }}</td>
                <td>
                    <form method="POST" action="/admin/categories/{{ cat.id }}/delete" style="display:inline" onsubmit="return confirm('Delete this category?')">
                        <button class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<div id="addCatModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)hideModal('addCatModal')">
    <div class="modal">
        <h3>Add Category</h3>
        <form method="POST" action="/admin/categories">
            <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Description</label><textarea name="description" rows="2"></textarea></div>
            <div class="modal-actions">
                <button type="button" class="btn" onclick="hideModal('addCatModal')" style="background:#f0f0f0;">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
<script>
function showModal(id){document.getElementById(id).style.display='flex';}
function hideModal(id){document.getElementById(id).style.display='none';}
</script>
{% endblock %}
