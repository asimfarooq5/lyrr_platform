{% extends "admin/base.html" %}
{% block content %}
<div class="header">
    <h2>Books</h2>
    <button class="btn btn-primary" onclick="showModal('addBookModal')">+ Add Book</button>
</div>
<div class="card">
    <table>
        <thead><tr><th>Title</th><th>Author</th><th>Type</th><th>Audio</th><th>Cover</th><th>Actions</th></tr></thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td><a href="/admin/books/{{ book.id }}" style="color:#6B4EFF;text-decoration:none;font-weight:600;">{{ book.title }}</a></td>
                <td>{{ book.author }}</td>
                <td><span style="font-size:12px;color:#666;">{{ book.book_type or 'fiction' }}</span></td>
                <td>{{ "✅" if book.media else "❌" }}</td>
                <td>{{ "✅" if book.cover_url else "❌" }}</td>
                <td>
                    <a href="/admin/books/{{ book.id }}" class="btn btn-sm" style="background:#6B4EFF;color:white;text-decoration:none;">Edit</a>
                    <button class="btn btn-danger btn-sm" onclick="confirmDelete('{{ book.id }}','{{ book.title }}')">Delete</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<div id="addBookModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)hideModal('addBookModal')">
    <div class="modal">
        <h3>Add Book</h3>
        <form method="POST" action="/admin/books">
            <div class="form-group"><label>Title</label><input type="text" name="title" required></div>
            <div class="form-group"><label>Author</label><input type="text" name="author"></div>
            <div class="form-group"><label>Description</label><textarea name="description" rows="3"></textarea></div>
            <div class="form-group"><label>Language</label><select name="language">
                <option value="en">English</option><option value="fr">Français</option>
                <option value="es">Español</option><option value="de">Deutsch</option>
            </select></div>
            <div class="modal-actions">
                <button type="button" class="btn" onclick="hideModal('addBookModal')" style="background:#f0f0f0;">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
<form id="deleteForm" method="POST" style="display:none;"></form>
<script>
function showModal(id){document.getElementById(id).style.display='flex';}
function hideModal(id){document.getElementById(id).style.display='none';}
function confirmDelete(id,title){
    if(confirm('Delete "'+title+'"?')){
        var f=document.getElementById('deleteForm');
        f.action='/admin/books/'+id+'/delete';
        f.submit();
    }
}
</script>
{% endblock %}
