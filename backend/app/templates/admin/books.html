{% extends "admin/base.html" %}
{% block content %}
<div class="header">
    <h2>Books</h2>
    <button class="btn btn-primary" onclick="showAddModal()">+ Add Book</button>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Language</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.language }}</td>
                <td><span class="badge badge-success">{{ book.status }}</span></td>
                <td>
                    <button class="btn btn-danger btn-sm" onclick="confirmDelete('{{ book.id }}', '{{ book.title }}')">Delete</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

<!-- Add Book Modal -->
<div id="addModal" class="modal-overlay" style="display:none;" onclick="if(event.target===this)hideAddModal()">
    <div class="modal">
        <h3>Add Book</h3>
        <form method="POST" action="/admin/books">
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" required>
            </div>
            <div class="form-group">
                <label>Author</label>
                <input type="text" name="author" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea name="description"></textarea>
            </div>
            <div class="form-group">
                <label>Language</label>
                <select name="language">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                </select>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn" onclick="hideAddModal()" style="background:#f0f0f0;">Cancel</button>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>

<!-- Delete Form -->
<form id="deleteForm" method="POST" style="display:none;">
    <input type="hidden" name="_method" value="DELETE">
</form>

<script>
function showAddModal() { document.getElementById('addModal').style.display = 'flex'; }
function hideAddModal() { document.getElementById('addModal').style.display = 'none'; }
function confirmDelete(id, title) {
    if (confirm('Delete "' + title + '"?')) {
        var f = document.getElementById('deleteForm');
        f.action = '/admin/books/' + id + '/delete';
        f.submit();
    }
}
</script>
{% endblock %}
