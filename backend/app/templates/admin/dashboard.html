{% extends "admin/base.html" %}
{% block content %}
<div class="header">
    <h2>Dashboard</h2>
</div>
<div class="stats">
    <div class="stat-card">
        <div class="icon" style="background: rgba(107,78,255,0.1); color: #6B4EFF;">📚</div>
        <div class="value">{{ stats.total_books }}</div>
        <div class="label">Total Books</div>
    </div>
    <div class="stat-card">
        <div class="icon" style="background: rgba(0,217,192,0.1); color: #00D9C0;">👥</div>
        <div class="value">{{ stats.total_users }}</div>
        <div class="label">Active Users</div>
    </div>
    <div class="stat-card">
        <div class="icon" style="background: rgba(255,107,107,0.1); color: #FF6B6B;">🔄</div>
        <div class="value">{{ stats.syncs_today }}</div>
        <div class="label">Syncs Today</div>
    </div>
</div>
{% endblock %}
